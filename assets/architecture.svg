  <text x="612" y="430" fill="#cbd5e1" font-size="10">&#8226; Pro-rated settlement</text>
  <text x="612" y="446" fill="#cbd5e1" font-size="10">&#8226; Exact conservation</text>
  <text x="612" y="462" fill="#10b981" font-size="10" font-weight="600">Zero dust loss proved</text>

  <rect x="780" y="356" width="170" height="120" rx="8" fill="#1f182c" stroke="#a855f7" stroke-width="1"/>
  <text x="792" y="378" fill="#c084fc" font-size="12" font-weight="700">Milestone Escrows</text>
  <text x="792" y="398" fill="#94a3b8" font-size="10">Multi-tranche delivery:</text>
  <text x="792" y="414" fill="#cbd5e1" font-size="10">&#8226; Up to 10 tranches</text>
  <text x="792" y="430" fill="#cbd5e1" font-size="10">&#8226; Independent arbiter</text>
  <text x="792" y="446" fill="#cbd5e1" font-size="10">&#8226; Dispute split logic</text>
  <text x="792" y="462" fill="#10b981" font-size="10" font-weight="600">Expiry reclaimable</text>

  <rect x="960" y="356" width="170" height="120" rx="8" fill="#14261e" stroke="#10b981" stroke-width="1"/>
  <text x="972" y="378" fill="#34d399" font-size="12" font-weight="700">Linear Payroll Stream</text>
  <text x="972" y="398" fill="#94a3b8" font-size="10">Continuous vesting:</text>
  <text x="972" y="414" fill="#cbd5e1" font-size="10">&#8226; Second-by-second rate</text>
  <text x="972" y="430" fill="#cbd5e1" font-size="10">&#8226; Configurable cliff</text>
  <text x="972" y="446" fill="#cbd5e1" font-size="10">&#8226; Employer clawback</text>
  <text x="972" y="462" fill="#10b981" font-size="10" font-weight="600">Accrued wages safe</text>

  <!-- Token Integration Strip -->
