  <circle cx="150" cy="100" r="180" fill="#0284c7" opacity="0.08" filter="url(#glowCyan)"/>
  <circle cx="1050" cy="580" r="220" fill="#7c3aed" opacity="0.08" filter="url(#glowCyan)"/>

  <!-- Top Header Banner -->
  <rect x="30" y="24" width="1140" height="64" rx="12" fill="#131d36" stroke="#26345e" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="50" y="52" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="0.5">AEVUM COPAYGUARD &amp; 6-DECIMAL tUSD8 SETTLEMENT SUITE</text>
  <text x="50" y="72" fill="#94a3b8" font-size="12">QDay Aevum Testnet Architecture &#8226; Confirmation-of-Payee &#8226; Anti-Poisoning &#8226; Escrow &#8226; Streaming</text>
  
  <!-- Badges -->
