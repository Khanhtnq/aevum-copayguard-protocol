  <text x="616" y="510" fill="#e2e8f0" font-size="11" font-weight="700">Official QDay Aevum tUSD8 Token Integration</text>
  <text x="616" y="528" fill="#94a3b8" font-size="10" font-family="monospace">Token: 0x456569838f1d43009A91ebA4263147Afd7233483 &#8226; Decimals: 6 &#8226; Strict ERC-20 Pre/Post Differential</text>
  <text x="616" y="544" fill="#38bdf8" font-size="10">&#8226; Fee-on-transfer tokens rejected &#8226; Non-6-decimal tokens rejected at constructor</text>

  <!-- Bottom Footer Status -->
  <rect x="30" y="608" width="1140" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="637" fill="#10b981" font-size="12" font-weight="700">&#10004; FORMALLY VERIFIED</text>
  <text x="180" y="637" fill="#94a3b8" font-size="11">12/12 Foundry Tests Passing (Fuzz + Fork) &#8226; 16/16 Pytest Suite Passing &#8226; Zero Warnings &#8226; Anti-Disqualification Window Guard Active</text>
</svg>
