  <text x="64" y="180" fill="#94a3b8" font-size="11" font-weight="600">TREASURY NATURAL LANGUAGE PROMPT</text>
  <text x="64" y="200" fill="#cbd5e1" font-size="11" font-family="monospace">"Pay invoice INV-884 for 1,250.50 tUSD8 to acme.cloud.billing</text>
  <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="monospace"> (Acme Cloud (APAC) Ltd) with 2% early discount, due 14d"</text>

