  <rect x="30" y="104" width="460" height="490" rx="14" fill="url(#cardGrad)" stroke="#26345e" stroke-width="1.4" filter="url(#cardShadow)"/>
  <path d="M 30 118 Q 30 104 44 104 L 476 104 Q 490 104 490 118 L 490 144 L 30 144 Z" fill="#172554"/>
  <text x="50" y="129" fill="#38bdf8" font-size="14" font-weight="700">1. OFF-CHAIN: $0 AI COPILOT &amp; SECURITY GATEWAY</text>

