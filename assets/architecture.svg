  <text x="82" y="295" fill="#94a3b8" font-size="11"><tspan fill="#e2e8f0" font-weight="600">_extract_balanced_parens:</tspan> Resolves nested legal names &amp; APAC tags</text>
  <circle cx="70" cy="312" r="3" fill="#38bdf8"/>
  <text x="82" y="315" fill="#94a3b8" font-size="11"><tspan fill="#e2e8f0" font-weight="600">_parse_tranche_strings:</tspan> Precision parsing for thousands commas (1,250.50)</text>
  <circle cx="70" cy="332" r="3" fill="#38bdf8"/>
  <text x="82" y="335" fill="#94a3b8" font-size="11"><tspan fill="#e2e8f0" font-weight="600">HTTP 413 &amp; Bounds Guard:</tspan> Rejects &gt;65,536 bytes before memory stream</text>

