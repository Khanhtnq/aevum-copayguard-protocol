  <text x="817" y="58" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">Chain ID 44005</text>
  
  <rect x="885" y="40" width="140" height="28" rx="14" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
  <text x="955" y="58" fill="#ede9fe" font-size="11" font-weight="600" text-anchor="middle">tUSD8 (6 Decimals)</text>

  <rect x="1035" y="40" width="115" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="1092" y="58" fill="#d1fae5" font-size="11" font-weight="600" text-anchor="middle">$0 AI Copilot</text>

