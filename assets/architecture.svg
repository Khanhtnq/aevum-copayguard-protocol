  <text x="610" y="246" fill="#a5b4fc" font-size="10">keccak256(handle, legal)</text>

  <rect x="780" y="210" width="180" height="52" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
