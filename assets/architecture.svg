  <text x="64" y="528" fill="#cbd5e1" font-size="11" font-family="monospace">Step 1: approve(vault, 1250500000) [6 decimals]</text>
  <text x="64" y="546" fill="#cbd5e1" font-size="11" font-family="monospace">Step 2: payVerifiedInvoice(1, payee, handleHash, ...)</text>
