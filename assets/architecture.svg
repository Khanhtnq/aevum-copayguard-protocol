  <text x="790" y="246" fill="#a5b4fc" font-size="10">propose &amp; accept checks</text>

  <rect x="970" y="210" width="160" height="52" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
  <text x="980" y="228" fill="#e0e7ff" font-size="11" font-weight="600">Anti-Poisoning Verification</text>
  <text x="980" y="246" fill="#a5b4fc" font-size="10">Atomic revert on mismatch</text>

